name: Reproducible Windows release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:pdf
      - name: Build unsigned input artifact for signing review
        run: npx electron-builder --win --publish never --config.win.signExecutable=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markdown-editor-windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
