<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 img-src 'self' file: data: blob: https:;
                 script-src 'self' blob:;
                 style-src 'self' 'unsafe-inline';
                 font-src 'self' data:;
                 worker-src 'self' blob:;
                 connect-src 'self' ws://127.0.0.1:5173;
                 object-src 'none'; base-uri 'none'; frame-src 'none';">
  <title>Markdown 编辑器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="sidebar-tabs">
          <button class="sidebar-tab active" data-tab="files">文件</button>
          <button class="sidebar-tab" data-tab="outline">目录</button>
        </div>
        <button id="btn-open-file" title="打开文件 (Ctrl+O)">📂</button>
      </div>
      <div id="file-list" class="sidebar-panel active">
        <div class="file-item placeholder">打开文件以开始</div>
      </div>
      <div id="outline-panel" class="sidebar-panel">
        <div id="outline-toolbar">
          <input id="outline-search" type="search" placeholder="搜索目录" aria-label="搜索目录">
          <button id="outline-collapse-all" type="button" title="折叠全部章节" aria-label="折叠全部章节">⊟</button>
        </div>
        <div id="outline-list">
          <div class="outline-item placeholder">打开文件后显示目录</div>
        </div>
      </div>
    </aside>
    <div id="resizer"></div>
    <main id="main-area">
      <div id="update-banner" role="status" aria-live="polite" hidden>
        <span id="update-message"></span>
        <button id="update-install" type="button" hidden>重启并安装</button>
        <button id="update-dismiss" type="button" aria-label="关闭更新提示">×</button>
      </div>
      <div id="editor-container"></div>
      <div id="status-bar">
        <span id="status-path" title="未打开文件">未打开文件</span>
        <span id="status-save">—</span>
        <span id="status-font-size">18px</span>
      </div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
